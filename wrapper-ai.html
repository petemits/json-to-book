<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Book – Full Wrapper</title>
  <style>
    /* (same styles as before – keep them) */
    * { margin:0; padding:0; box-sizing:border-box; }
    body { height:100vh; overflow:hidden; background:#fff; }
    #book-frame { width:100%; height:100%; border:none; display:block; }
    #floating-widget { position:fixed; bottom:20px; right:20px; z-index:9999; }
    #widget-toggle { background:#2c3e50; color:#fff; border:none; border-radius:50%; width:60px; height:60px; font-size:28px; cursor:pointer; box-shadow:0 4px 12px rgba(0,0,0,.3); transition:transform .2s; }
    #widget-toggle:hover { transform:scale(1.05); }
    #widget-panel { display:none; position:absolute; bottom:70px; right:0; width:450px; max-height:70vh; background:#fff; border-radius:12px; box-shadow:0 8px 32px rgba(0,0,0,.2); overflow-y:auto; padding:1rem; text-align:left; font-size:.9rem; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    #widget-panel h4 { margin:0 0 0.5rem; color:#2c3e50; }
    .card { background:#f8f9fa; padding:0.5rem; border-radius:6px; display:inline-block; margin:0.2rem; min-width:70px; text-align:center; }
    .card strong { display:block; font-size:1.2rem; }
    .tag { display:inline-block; background:#eee; padding:0.1rem 0.5rem; border-radius:10px; font-size:0.7rem; margin:0.1rem; }
    #widget-search { width:100%; padding:0.3rem; border:1px solid #ddd; border-radius:6px; margin:0.5rem 0; }
    #widget-results { max-height:150px; overflow-y:auto; }
    .widget-result { border-bottom:1px solid #eee; padding:0.3rem 0; }
    .widget-result a { color:#2c3e50; text-decoration:none; }
    .widget-result a:hover { text-decoration:underline; }
    .badge { font-size:0.7rem; background:#3498db; color:#fff; padding:0.1rem 0.4rem; border-radius:10px; margin-left:0.3rem; }
    #chat-container { margin-top:0.5rem; border-top:1px solid #eee; padding-top:0.5rem; }
    #chat-messages { max-height:150px; overflow-y:auto; margin-bottom:0.5rem; }
    #chat-messages div { margin:0.2rem 0; padding:0.2rem 0.6rem; border-radius:8px; }
    #chat-messages .user { background:#e3f2fd; text-align:right; }
    #chat-messages .bot { background:#f5f5f5; }
    #chat-input-row { display:flex; gap:0.3rem; }
    #chat-input { flex:1; padding:0.3rem; border:1px solid #ddd; border-radius:6px; }
    #chat-send { padding:0.3rem 0.6rem; background:#2c3e50; color:#fff; border:none; border-radius:6px; cursor:pointer; }
    .tab-bar { display:flex; gap:0.3rem; margin-bottom:0.5rem; }
    .tab-btn { flex:1; padding:0.3rem; border:none; border-radius:4px; cursor:pointer; background:#ddd; color:#333; }
    .tab-btn.active { background:#2c3e50; color:#fff; }
    @media(max-width:600px){ #widget-panel { width:300px; right:-10px; } }
  </style>
</head>
<body>
  <!-- Book iframe -->
  <iframe id="book-frame" src="book.html"></iframe>

  <!-- Floating Widget -->
  <div id="floating-widget">
    <button id="widget-toggle" onclick="toggleWidget()">🤖</button>
    <div id="widget-panel">
      <h4>🧠 AI Assistant</h4>
      <div class="tab-bar">
        <button class="tab-btn active" onclick="switchTab('insights')" id="tab-insights">Insights</button>
        <button class="tab-btn" onclick="switchTab('chat')" id="tab-chat">Chat</button>
        <button class="tab-btn" onclick="switchTab('deep')" id="tab-deep">🧠 Deep</button>
      </div>
      <div id="tab-content">
        <!-- filled by JavaScript -->
      </div>
    </div>
  </div>

  <script>
    // ================================================================
    // 1. LOAD DATA FROM book-data.json
    // ================================================================
    let bookData = null;

    fetch('book-data.json')
      .then(res => {
        if (!res.ok) throw new Error('Could not fetch book-data.json');
        return res.json();
      })
      .then(data => {
        bookData = data;
        console.log('📚 Data loaded:', bookData.conversations.length, 'conversations');
        initWidget();
      })
      .catch(err => {
        console.error('❌ Failed to load data:', err);
        document.getElementById('tab-content').innerHTML = '<p style="color:red;">⚠️ Could not load book-data.json. Make sure it is generated and in the same folder.</p>';
      });

    // ================================================================
    // 2. AI ENGINE (copied from index.js – same as before)
    // ================================================================
    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
    }

    class AdvancedSearch {
      constructor(convs) {
        this.convs = convs;
        this.docs = convs.map(c => c.messages.map(m => m.content).join(' '));
        this.vocab = {}; this.idf = {}; this.vecs = [];
        this.build();
      }
      build() {
        const docCount = this.docs.length;
        const termDocFreq = {};
        for (const doc of this.docs) {
          const tokens = new Set(this.tokenize(doc));
          for (const t of tokens) termDocFreq[t] = (termDocFreq[t] || 0) + 1;
        }
        this.vocab = Object.keys(termDocFreq);
        for (const t of this.vocab) this.idf[t] = Math.log(docCount / (1 + termDocFreq[t]));
        this.vecs = this.docs.map(doc => {
          const tf = {};
          for (const t of this.tokenize(doc)) tf[t] = (tf[t] || 0) + 1;
          const vec = {};
          for (const t of this.vocab) vec[t] = (tf[t] || 0) * this.idf[t];
          return vec;
        });
      }
      tokenize(t) { return t.toLowerCase().replace(/[^a-z\s']/g, ' ').split(/\s+/).filter(w => w.length > 0); }
      cosine(v1, v2) {
        let dot = 0, n1 = 0, n2 = 0;
        for (const t in v1) {
          if (v2[t] !== undefined) dot += v1[t] * v2[t];
          n1 += v1[t] * v1[t];
        }
        for (const t in v2) n2 += v2[t] * v2[t];
        return (n1 && n2) ? dot / (Math.sqrt(n1) * Math.sqrt(n2)) : 0;
      }
      query(q) {
        const tokens = this.tokenize(q);
        const qVec = {};
        for (const t of tokens) if (this.idf[t] !== undefined) qVec[t] = (qVec[t] || 0) + 1 * this.idf[t];
        const scores = this.vecs.map((v, i) => ({ index: i, score: this.cosine(v, qVec) }));
        scores.sort((a, b) => b.score - a.score);
        return scores.slice(0, 5);
      }
    }

    class SpellChecker {
      constructor() {
        this.words = new Set(['the','be','to','of','and','a','in','that','have','i','it','for','not','on','with','he','as','you','do','at','this','but','his','by','from','they','we','say','her','she','or','an','will','my','one','all','would','there','their','what','so','up','out','if','about','who','get','which','go','me','when','make','can','like','time','no','just','him','know','take','people','into','year','your','good','some','could','them','see','other','than','then','now','look','only','come','its','over','think','also','back','after','use','two','how','our','work','first','well','way','even','new','want','because','any','these','give','day','most','us','is','was','are','were','has','had','did','does','done','said','says','made','make','making','put','putting','set','setting','let','getting','got','gotten','seen','sees','went','gone','goes','going','come','coming','came','take','taking','took','taken','look','looking','looked','know','knows','known','knew','think','thinking','thought','find','finding','found','tell','telling','told','ask','asking','asked','work','working','worked','seem','seeming','seemed','feel','feeling','felt','try','trying','tried','leave','leaving','left','call','calling','called','good','better','best','bad','worse','worst','much','more','most','little','less','least','many','several','some','any','none','all','each','every','both','neither','either','not','only','just','very','too','also','even','ever','never','always','sometimes','often','usually','finally','eventually','actually','basically','probably','certainly','definitely','absolutely','maybe','perhaps','possibly','likely','unlikely','quite','rather','fairly','pretty','almost','nearly','about','around','across','through','between','among','within','without','outside','inside','above','below','under','over','behind','beside','next','near','far','away','back','forward','up','down','off','on','in','out','over','under','again','once','twice','three','four','five','six','seven','eight','nine','ten','hundred','thousand','million','billion','first','second','third','fourth','fifth','sixth','seventh','eighth','ninth','tenth','last','next','previous','current','same','different','other','another','one','two','three','four','five','six','seven','eight','nine','ten','zero','plus','minus','times','divided','equal','percent','number','point','line','code','function','return','const','let','var','class','object','array','string','number','boolean','null','undefined','true','false','if','else','switch','case','break','continue','for','while','do','try','catch','finally','throw','import','export','default','from','as','new','this','super','extends','implements','interface','type','enum','void','any','unknown','never','readonly','optional','rest','spread','template','literal','arrow','async','await','generator','yield','module','package','require','exports','global','process','buffer','fs','path','http','https','url','querystring','crypto','stream','events','util','os','child_process','cluster','worker','web','app','api','server','client','data','user','admin','login','logout','register','signup','signin','password','email','phone','address','city','state','zip','country','name','first','last','full','middle','title','description','content','body','header','footer','nav','sidebar','section','article','aside','main','div','span','input','button','link','img','video','audio','canvas','svg','table','row','cell','grid','flex','block','inline','hidden','visible','active','focus','hover','click','change','submit','reset','scroll','resize','load','error','success','warning','info','debug','trace','log','assert','test','unit','integration','e2e','performance','security','auth','cors','csrf','xss','sql','nosql','mongodb','postgres','mysql','sqlite','redis','memcached','docker','kubernetes','aws','azure','gcp','firebase','heroku','netlify','vercel','cloud','serverless','function','lambda','trigger','event','schedule','cron','job','queue','pubsub','kafka','rabbitmq','websocket','socket','io','ajax','fetch','axios','graphql','rest','soap','json','xml','yaml','toml','env','config','settings','option','default','example','sample','demo','tutorial','guide','manual','docs','readme','license','mit','apache','gpl','bsd','unlicense','open','source','free','paid','subscription','trial','premium','basic','standard','enterprise','professional','advanced','beginner','intermediate','expert','master','certified','trained','learning','teaching','course','class','lesson','exercise','solution','answer','question','quiz','exam','test','grade','score','result','outcome','analysis','summary','report','insight','trend','pattern','forecast','prediction','suggestion','recommendation','feedback','review','rating','star','like','share','comment','reply','mention','follow','unfollow','block','report','flag','spam','abuse','violation','policy','terms','condition','privacy','cookie','data','protection','gdpr','ccpa','regulation','compliance','audit','log','monitor','alert','notification','popup','modal','dialog','tooltip','dropdown','menu','navbar','footer','header','section','aside','main','content','wrapper','container','grid','flex','row','col','span','offset','push','pull','order','align','justify','center','left','right','top','bottom','middle','baseline','stretch','space','between','around','evenly','auto','fixed','relative','absolute','sticky','scroll','overflow','clip','mask','filter','blur','brightness','contrast','grayscale','sepia','hue','rotate','scale','translate','skew','perspective','transform','transition','animation','keyframe','duration','delay','timing','ease','linear','easein','easeout','easeinout','step','cubic','bezier','interpolate','extrapolate']);
      }
      editDistance(s1, s2) {
        const m = s1.length, n = s2.length;
        const dp = Array.from({ length: m + 1 }, (_, i) => Array(n + 1).fill(0));
        for (let i = 0; i <= m; i++) dp[i][0] = i;
        for (let j = 0; j <= n; j++) dp[0][j] = j;
        for (let i = 1; i <= m; i++) {
          for (let j = 1; j <= n; j++) {
            if (s1[i - 1] === s2[j - 1]) dp[i][j] = dp[i - 1][j - 1];
            else dp[i][j] = 1 + Math.min(dp[i - 1][j], dp[i][j - 1], dp[i - 1][j - 1]);
          }
        }
        return dp[m][n];
      }
      correct(w) {
        if (this.words.has(w)) return w;
        let best = w, bestDist = Infinity;
        for (const dw of this.words) {
          const d = this.editDistance(w, dw);
          if (d < bestDist) { bestDist = d; best = dw; }
        }
        return bestDist <= 2 ? best : w;
      }
      correctSentence(text) { return text.split(/\s+/).map(w => this.correct(w)).join(' '); }
    }

    class MarkovChain {
      constructor() { this.trigrams = {}; }
      build(texts) {
        for (const text of texts) {
          const words = text.toLowerCase().replace(/[^a-z\s']/g, ' ').split(/\s+/).filter(w => w.length > 0);
          for (let i = 0; i < words.length - 2; i++) {
            const key = words[i] + ' ' + words[i + 1];
            if (!this.trigrams[key]) this.trigrams[key] = [];
            this.trigrams[key].push(words[i + 2]);
          }
        }
      }
      predict(prefix) {
        const words = prefix.toLowerCase().replace(/[^a-z\s']/g, ' ').split(/\s+/).filter(w => w.length > 0);
        if (words.length < 2) return null;
        const key = words[words.length - 2] + ' ' + words[words.length - 1];
        const candidates = this.trigrams[key] || [];
        if (!candidates.length) return null;
        const freq = {};
        for (const c of candidates) freq[c] = (freq[c] || 0) + 1;
        let best = null, bestFreq = 0;
        for (const [w, f] of Object.entries(freq)) if (f > bestFreq) { bestFreq = f; best = w; }
        return best;
      }
    }

    class CognitiveEngine {
      constructor(bd) {
        this.bd = bd;
        this.search = new AdvancedSearch(bd.conversations);
        this.spell = new SpellChecker();
        this.markov = new MarkovChain();
        this.markov.build(bd.conversations.map(c => c.messages.map(m => m.content).join(' ')));
        this.memory = [];
        this.context = { topic: null, sentiment: null };
      }
      processQuery(raw, opts = {}) {
        let q = raw;
        if (opts.autocorrect !== false) q = this.spell.correctSentence(q);
        this.memory.push({ role: 'user', content: q });
        const sentiment = this.sentimentOf(q);
        const qCount = (q.split('?').length - 1);
        this.context.sentiment = sentiment;
        if (qCount) this.context.topic = q.split('?')[0].slice(0, 50);
        const matches = this.search.query(q);
        let response = '';
        if (matches.length && matches[0].score > 0.01) {
          const conv = this.bd.conversations[matches[0].index];
          const assistant = conv.messages.find(m => m.role === 'assistant');
          if (assistant) {
            const snippet = assistant.content.split(/\n/).filter(s => s.trim()).slice(0, 3).join(' ');
            response = 'I found this: <br>' + escapeHtml(snippet) + '<br><small><a href="javascript:void(0)" onclick="document.getElementById(\'book-frame\').contentWindow.location.hash=\'#ch-' + matches[0].index + '\'">View full</a></small>';
          } else {
            response = 'I found a conversation but no assistant reply.';
          }
        } else {
          response = 'I’m not sure. Could you ask about a specific conversation?';
        }
        if (opts.sentimentStyle !== false) {
          if (sentiment === 'negative') response = '🤗 I understand this might be frustrating. ' + response;
          else if (sentiment === 'positive') response = '😊 Glad you’re interested! ' + response;
        }
        const next = this.markov.predict(q);
        if (next) response += '<br><small>💡 Next word hint: "' + next + '" (Markov)</small>';
        this.memory.push({ role: 'assistant', content: response });
        return { response, correctedQuery: q, sentiment, matches };
      }
      sentimentOf(text) {
        const pos = ['good','great','excellent','happy','love','amazing','wonderful','nice','beautiful','glad','appreciate','thanks'];
        const neg = ['bad','terrible','awful','horrible','sad','hate','angry','upset','disappointed','fail','error','issue','problem','wrong','broken'];
        const tokens = text.toLowerCase().split(/\s+/);
        let s = 0;
        for (const w of tokens) {
          if (pos.includes(w)) s++;
          if (neg.includes(w)) s--;
        }
        return s > 0 ? 'positive' : s < 0 ? 'negative' : 'neutral';
      }
    }

    // ================================================================
    // 3. WIDGET LOGIC
    // ================================================================
    let cognitive = null;
    let currentTab = 'insights';

    function initWidget() {
      cognitive = new CognitiveEngine(bookData);
      switchTab('insights');
    }

    function toggleWidget() {
      const panel = document.getElementById('widget-panel');
      panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('tab-' + tab).classList.add('active');
      const container = document.getElementById('tab-content');
      if (tab === 'insights') renderInsights(container);
      else if (tab === 'chat') renderChat(container);
      else if (tab === 'deep') renderDeep(container);
    }

    function renderInsights(container) {
      const s = bookData.summary;
      let html = `
        <div class="widget-section">
          <span class="card"><strong>${s.totalConversations}</strong>Conversations</span>
          <span class="card"><strong>${s.totalMessages}</strong>Messages</span>
          <span class="card"><strong>${s.avgSentiment.toFixed(2)}</strong>Avg Sentiment</span>
        </div>
        <div><h5>😊 Emotions</h5>`;
      for (const [k,v] of Object.entries(s.dominantEmotions)) {
        html += `<span class="tag">${k}: ${v}</span>`;
      }
      html += `</div><div><h5>🔍 Patterns</h5>`;
      for (const [k,v] of Object.entries(s.topPatterns)) {
        html += `<span class="tag">${k}: ${v}</span>`;
      }
      html += `</div><hr><h5>🔎 Search</h5>
        <input type="text" id="widget-search" placeholder="e.g. 'code'" oninput="searchConversations(this.value)">
        <div id="widget-results"><div id="widget-status">Type to search...</div></div>
      `;
      container.innerHTML = html;
    }

    window.searchConversations = function(query) {
      if (!cognitive) return;
      const resDiv = document.getElementById('widget-results');
      if (!query.trim()) { resDiv.innerHTML = '<div id="widget-status">Type to search...</div>'; return; }
      const q = query.toLowerCase();
      const matches = bookData.conversations.filter((c, i) => {
        const ai = bookData.aiData[i] || {};
        const title = c.title.toLowerCase();
        const content = c.messages.map(m => m.content).join(' ').toLowerCase();
        const meta = (ai.sentiment || '') + ' ' + (ai.emotion || '') + ' ' + (ai.patterns || []).join(' ');
        return title.indexOf(q) !== -1 || content.indexOf(q) !== -1 || meta.indexOf(q) !== -1;
      });
      if (!matches.length) { resDiv.innerHTML = '<div id="widget-status">No matches.</div>'; return; }
      let html = '<div id="widget-status">' + matches.length + ' result(s)</div>';
      matches.forEach(c => {
        const ai = bookData.aiData[bookData.conversations.indexOf(c)] || {};
        const sent = ai.sentiment || 'neutral';
        const emoji = ai.emotion === 'joy' ? '😊' : ai.emotion === 'anger' ? '😠' : ai.emotion === 'sadness' ? '😢' : ai.emotion === 'fear' ? '😨' : ai.emotion === 'surprise' ? '😲' : '🤖';
        const pos = bookData.conversations.indexOf(c);
        const bg = sent === 'positive' ? '#28a745' : sent === 'negative' ? '#dc3545' : '#6c757d';
        html += `<div class="widget-result"><a href="javascript:void(0)" onclick="document.getElementById('book-frame').contentWindow.location.hash='#ch-${pos}'">${escapeHtml(c.title)}</a><span class="badge" style="background:${bg}">${sent}</span><span class="badge">${emoji} ${ai.emotion||'none'}</span></div>`;
      });
      resDiv.innerHTML = html;
    };

    function renderChat(container) {
      container.innerHTML = `
        <p style="font-size:0.9rem;color:#555;">Ask about the book.</p>
        <div id="chat-messages"><div class="bot">👋 Ask me anything.</div></div>
        <div id="chat-input-row">
          <input type="text" id="chat-input" placeholder="Type..." onkeypress="if(event.key==='Enter') sendChat()">
          <button id="chat-send" onclick="sendChat()">Send</button>
        </div>
      `;
    }

    window.sendChat = function() {
      if (!cognitive) return alert('Data not loaded yet.');
      const input = document.getElementById('chat-input');
      const msg = input.value.trim();
      if (!msg) return;
      const chatDiv = document.getElementById('chat-messages');
      chatDiv.innerHTML += `<div class="user">🧑 ${escapeHtml(msg)}</div>`;
      input.value = '';
      const res = cognitive.processQuery(msg, { autocorrect: true, sentimentStyle: true });
      chatDiv.innerHTML += `<div class="bot">🤖 ${res.response}</div>`;
      chatDiv.scrollTop = chatDiv.scrollHeight;
    };

    function renderDeep(container) {
      container.innerHTML = `
        <p style="font-size:0.9rem;color:#555;">Cognitive engine with autocorrect & Markov.</p>
        <div id="deep-messages"><div class="bot">🧠 I use TF‑IDF and Markov. Ask anything.</div></div>
        <div id="chat-input-row">
          <input type="text" id="deep-input" placeholder="Ask..." onkeypress="if(event.key==='Enter') sendDeep()">
          <button id="deep-send" onclick="sendDeep()">Send</button>
        </div>
        <div style="margin-top:0.5rem;">
          <label><input type="checkbox" id="deep-autocorrect" checked> Autocorrect</label>
          <label style="margin-left:1rem;"><input type="checkbox" id="deep-sentiment-style" checked> Sentiment styling</label>
        </div>
      `;
    }

    window.sendDeep = function() {
      if (!cognitive) return alert('Data not loaded yet.');
      const input = document.getElementById('deep-input');
      const msg = input.value.trim();
      if (!msg) return;
      const chatDiv = document.getElementById('deep-messages');
      const auto = document.getElementById('deep-autocorrect').checked;
      const style = document.getElementById('deep-sentiment-style').checked;
      chatDiv.innerHTML += `<div class="user">🧑 ${escapeHtml(msg)}</div>`;
      input.value = '';
      const res = cognitive.processQuery(msg, { autocorrect: auto, sentimentStyle: style });
      let html = res.response;
      if (res.correctedQuery !== msg) {
        html += `<br><small>🔧 Corrected: "${escapeHtml(res.correctedQuery)}"</small>`;
      }
      if (res.matches && res.matches.length) {
        html += `<br><small>📊 Top match score: ${res.matches[0].score.toFixed(3)}</small>`;
      }
      chatDiv.innerHTML += `<div class="bot">🧠 ${html}</div>`;
      chatDiv.scrollTop = chatDiv.scrollHeight;
    };

    // Make functions globally accessible
    window.toggleWidget = toggleWidget;
    window.switchTab = switchTab;
    window.sendChat = sendChat;
    window.sendDeep = sendDeep;
    window.searchConversations = searchConversations;
  </script>
</body>
</html>
